<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Toolkit | ARYONIX Demo</title>
  <style>
    body{margin:0;background:#04071a;color:#e8eeff;font-family:Inter,Arial,sans-serif}
    main{min-height:100vh;padding:48px;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,rgba(77,163,255,.28),transparent 34rem)}
    .shell{width:min(1120px,100%);border:1px solid rgba(200,212,232,.18);border-radius:18px;background:rgba(8,13,36,.82);padding:32px;box-shadow:0 30px 110px rgba(0,0,0,.45)}
    h1{font-size:clamp(44px,8vw,96px);line-height:.95;margin:0 0 18px}p{color:#c8d4e8;font-size:18px;line-height:1.7;max-width:760px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:34px}.card{border:1px solid rgba(200,212,232,.16);border-radius:14px;background:rgba(255,255,255,.045);padding:22px}.card b{color:#4da3ff}.bar{height:12px;border-radius:99px;background:#1a6fff;margin-top:28px}.muted{background:#23375f;width:72%}
  </style>
</head>
<body><main><section class="shell"><h1>Student Toolkit</h1><p>A polished academic productivity workspace for planning study sessions, organizing notes and keeping task lists readable on every device.</p><div class="grid"><div class="card"><b>Planner</b><div class="bar"></div><div class="bar muted"></div></div><div class="card"><b>Notes</b><div class="bar"></div><div class="bar muted"></div></div><div class="card"><b>Tasks</b><div class="bar"></div><div class="bar muted"></div></div></div></section></main></body>
</html>
