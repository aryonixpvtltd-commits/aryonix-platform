<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CGPA Calculator | ARYONIX Demo</title>
  <style>
    body{margin:0;background:#04071a;color:#e8eeff;font-family:Inter,Arial,sans-serif}
    main{min-height:100vh;padding:48px;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,rgba(26,111,255,.32),transparent 34rem)}
    .shell{width:min(1060px,100%);display:grid;gap:18px;grid-template-columns:1.1fr .9fr}.panel{border:1px solid rgba(200,212,232,.18);border-radius:18px;background:rgba(8,13,36,.84);padding:30px;box-shadow:0 30px 110px rgba(0,0,0,.45)}
    h1{font-size:clamp(42px,7vw,82px);line-height:.96;margin:0 0 16px}p,label{color:#c8d4e8;line-height:1.7}.field{height:54px;border:1px solid rgba(200,212,232,.16);border-radius:14px;background:rgba(255,255,255,.05);margin:14px 0}.score{font-size:112px;font-weight:800;margin:28px 0 4px}.button{display:inline-block;margin-top:18px;border-radius:14px;background:#1a6fff;padding:16px 22px;font-weight:700}@media(max-width:800px){.shell{grid-template-columns:1fr}main{padding:20px}}
  </style>
</head>
<body><main><section class="shell"><div class="panel"><h1>CGPA Calculator</h1><p>Enter semester performance and get an instant academic score with a responsive, validation-friendly flow.</p><div class="field"></div><div class="field"></div><span class="button">Calculate CGPA</span></div><div class="panel"><p>Calculated CGPA</p><div class="score">8.72</div><p>Clean result state with room for semester insights and improvement planning.</p></div></section></main></body>
</html>
